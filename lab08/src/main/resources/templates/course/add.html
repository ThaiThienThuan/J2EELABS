<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add / Edit Course - Course Registration</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        .form-section {
            max-width: 600px;
            margin: 2rem auto;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="form-section">

            <h2 th:text="${course.id == null ? 'Add New Course' : 'Update Course'}" class="mb-4"></h2>

           <form th:action="@{/admin/courses/save}" th:object="${course}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Course Name <span class="text-danger">*</span></label>
                    <input type="text" 
                           th:field="*{name}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                           required>

                    <p class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>

                <div class="mb-3">
                    <label class="form-label">Image URL</label>
                    <input type="text" 
                           th:field="*{image}" 
                           class="form-control"
                           placeholder="https://example.com/image.jpg">
                </div>

                <div class="mb-3">
                    <label class="form-label">Credits <span class="text-danger">*</span></label>
                    <input type="number" 
                           th:field="*{credits}" 
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Lecturer</label>
                    <input type="text" 
                           th:field="*{lecturer}" 
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Category <span class="text-danger">*</span></label>

                    <select th:field="*{category}" class="form-select" required>
                        <option value="">Select a category</option>
                        <option th:each="cat : ${categories}" 
                                th:value="${cat.id}" 
                                th:text="${cat.name}">
                        </option>

                    </select>

                </div>
                <div class="mb-3">
                    <label>Price</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control"/>
                </div>
                <div class="d-grid gap-2 d-sm-flex">
                    <button type="submit" class="btn btn-success">
                        Save Course </button>

                    <a th:href="@{/home}" class="btn btn-secondary">
                        Cancel </a>
                </div>

            </form>

        </div>

    </div>

</body>

</html>
