<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>

    <meta charset="UTF-8">

    <title>Course Registration</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            flex: 1;
        }
        footer {
            margin-top: auto;
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand" th:href="@{/home}">
                Courses </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/courses}">
                            Course List
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasAuthority('ROLE_STUDENT')">
                        <a class="nav-link" th:href="@{/enroll/my-courses}">
                            My Courses
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
                        <a class="nav-link" th:href="@{/admin/courses/add}"> Add Course </a>
                    </li>

                </ul>

                <form class="d-flex me-3" th:action="@{/courses/search}" method="get">

                    <input class="form-control me-2" type="text" name="keyword" placeholder="Search course">

                    <button class="btn btn-outline-light" type="submit">
                        Search </button>

                </form>

                <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                    <span class="text-light me-3" sec:authentication="name"></span>
                    <form th:action="@{/logout}" method="POST" class="d-inline">
                        <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
                    </form>
                </div>

            </div>

        </div>

    </nav>

    <div class="container mt-4">

        <div th:replace="${content}"></div>

    </div>

</body>

<footer class="text-center mt-4 mb-3">
    <hr>
    <p>&copy; 2025 - Phát triển ứng dụng với J2EE</p>
</footer>

</html>
