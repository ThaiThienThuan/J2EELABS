<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>My Cart</h2>

    <div th:if="${cart.isEmpty()}">
        <p>Your cart is empty.</p>
        <a th:href="@{/home}" class="btn btn-primary">Continue Browsing Courses</a>
    </div>

    <div th:unless="${cart.isEmpty()}">
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Course</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cart}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.price}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${item.price * item.quantity}"></td>
                <td>
                    <a th:href="@{/cart/remove/{id}(id=${item.id})}" class="btn btn-danger btn-sm">Remove</a>
                </td>
            </tr>
            </tbody>
        </table>

        <h4>Total: <span th:text="${total}"></span></h4>

        <a th:href="@{/cart/checkout}" class="btn btn-success">Confirm Enrollment</a>
        <a th:href="@{/home}" class="btn btn-secondary">Continue Browsing</a>
    </div>

</div>
</body>
</html>
