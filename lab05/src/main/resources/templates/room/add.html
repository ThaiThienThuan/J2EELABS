<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm/Sửa phòng trọ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2 th:text="${room.id == null ? 'Thêm phòng mới' : 'Cập nhật phòng'}"></h2>
    <hr>
    <form th:action="@{/rooms/save}" th:object="${room}" method="post" class="w-50">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Tên phòng:</label>
            <input type="text" th:field="*{name}" class="form-control">
            <p class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label">Link hình ảnh:</label>
            <input type="text" th:field="*{image}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Giá thuê:</label>
            <input type="number" th:field="*{price}" class="form-control">
            <p class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label">Loại phòng:</label>
            <select th:field="*{category}" class="form-select">
                <option th:each="cat : ${categories}" 
                        th:value="${cat.id}" 
                        th:text="${cat.name}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Lưu lại</button>
        <a th:href="@{/rooms}" class="btn btn-secondary">Quay lại</a>
    </form>
</body>
</html>
