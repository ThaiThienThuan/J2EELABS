<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Courses - Course Registration</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        h2 {
            margin-bottom: 2rem;
            color: #333;
        }
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
        }
    </style>

</head>

<body>

    <div class="container mt-4">

        <h2>My Enrolled Courses</h2>

        <a href="/home" class="btn btn-secondary mb-4">
            Back Home
        </a>

        <div th:if="${enrollments.isEmpty()}" class="empty-state">
            <p class="text-muted">You haven't enrolled in any courses yet.</p>
            <a href="/home" class="btn btn-primary">Browse Courses</a>
        </div>

        <div th:unless="${enrollments.isEmpty()}">

            <!-- Table view for desktop -->
            <div class="table-responsive d-none d-md-block">
                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>
                            <th>Course Name</th>
                            <th>Credits</th>
                            <th>Lecturer</th>
                            <th>Category</th>
                            <th>Enrolled Date</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="e : ${enrollments}">

                            <td th:text="${e.course.name}"></td>

                            <td th:text="${e.course.credits}"></td>

                            <td th:text="${e.course.lecturer}"></td>

                            <td th:text="${e.course.category != null ? e.course.category.name : 'N/A'}"></td>

                            <td th:text="${#temporals.format(e.enrollDate, 'dd/MM/yyyy')}"></td>

                        </tr>

                    </tbody>

                </table>
            </div>

            <!-- Card view for mobile -->
            <div class="row d-md-none">
                <div class="col-12 mb-3" th:each="e : ${enrollments}">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${e.course.name}"></h5>
                            <p class="card-text">
                                <strong>Lecturer:</strong> <span th:text="${e.course.lecturer}"></span>
                            </p>
                            <p class="card-text">
                                <strong>Credits:</strong> <span th:text="${e.course.credits}"></span>
                            </p>
                            <p class="card-text">
                                <strong>Category:</strong> <span th:text="${e.course.category != null ? e.course.category.name : 'N/A'}"></span>
                            </p>
                            <p class="card-text text-muted">
                                <strong>Enrolled:</strong> <span th:text="${#temporals.format(e.enrollDate, 'dd/MM/yyyy')}"></span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
