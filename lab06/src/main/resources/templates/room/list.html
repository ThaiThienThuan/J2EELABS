<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý phòng trọ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2 class="mb-4">Danh sách phòng trọ</h2>
    <a th:href="@{/rooms/add}" class="btn btn-primary mb-3">Thêm phòng mới</a>
    
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Tên phòng</th>
                <th>Hình ảnh</th>
                <th>Giá thuê</th>
                <th>Loại phòng</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="r : ${rooms}">
                <td th:text="${r.id}"></td>
                <td th:text="${r.name}"></td>
                <td>
                    <img th:src="${r.image}" width="100" class="img-thumbnail" alt="Chưa có ảnh">
                </td>
                <td th:text="${#numbers.formatDecimal(r.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                <td th:text="${r.category.name}"></td>
                <td>
                    <a th:href="@{/rooms/edit/{id}(id=${r.id})}" class="btn btn-warning btn-sm">Sửa</a>
                    <a th:href="@{/rooms/delete/{id}(id=${r.id})}" 
                       onclick="return confirm('Bạn có chắc chắn muốn xóa?')" 
                       class="btn btn-danger btn-sm">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
